name: Close Stale Assigned Issues

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  close-stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close Stale Assigned Issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Calculate the cutoff date (3 days ago)
          CUTOFF_DATE=$(date -d "3 days ago" +%Y-%m-%d)
          
          echo "Finding assigned open issues without a linked PR that were last updated before $CUTOFF_DATE..."
          
          # Search for issues that:
          # - Are open (is:open)
          # - Are issues, not PRs (is:issue)
          # - Have someone assigned (has:assignee)
          # - Do not have a linked PR (-linked:pr)
          # - Haven't had activity in 3 days (updated:<YYYY-MM-DD)
          ISSUES=$(gh issue list \
            --search "is:issue is:open has:assignee -linked:pr updated:<$CUTOFF_DATE" \
            --repo ${{ github.repository }} \
            --json number \
            -q '.[].number')
            
          if [ -z "$ISSUES" ]; then
            echo "No stale assigned issues found."
            exit 0
          fi
          
          for issue in $ISSUES; do
            echo "Closing issue #$issue..."
            # Close the issue with reason "not planned" and leave an explanatory comment
            gh issue close $issue \
              --reason "not planned" \
              -c "This issue has been assigned for over 3 days without any Pull Request submitted. It is now being automatically closed as \"not planned\". If you are still working on this and want to submit a PR, feel free to open a new issue or request for this to be reopened!"
          done
