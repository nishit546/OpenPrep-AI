version: '3.8'

# DEVELOPMENT-ONLY defaults: the credential values below (postgres/postgres,
# dev JWT secret) are for local development only and MUST NOT be used in
# production. Override any value via a `.env` file in this directory (see
# `.env.example`) without editing this file.

services:
  postgres:
    image: postgres:16-alpine
    container_name: openprep_postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-openprep}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - openprep_net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-openprep}']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openprep_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - openprep_net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    container_name: openprep_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-openprep}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_openprep_12345}
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openprep_net
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: openprep_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - openprep_net

  prometheus:
    image: prom/prometheus:latest
    container_name: openprep_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - backend
    networks:
      - openprep_net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: openprep_jaeger
    restart: unless-stopped
    ports:
      - '16686:16686'
      - '4317:4317'
      - '4318:4318'
    networks:
      - openprep_net

  code-runner:
    build:
      context: ./backend/docker/runner
      dockerfile: Dockerfile
    image: openprep-runner:latest
    container_name: openprep_code_runner
    profiles:
      - sandbox

volumes:
  pg_data:
  redis_data:

networks:
  openprep_net:
    driver: bridge
